<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antológico – Autenticación</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(148deg, #E85D4A 0%, #C4412F 48%, #8C2E1F 100%);
    color: #fff; text-align: center; padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
    border-radius: 20px; padding: 40px 28px; max-width: 340px; width: 100%;
  }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p { font-size: 14px; opacity: 0.85; line-height: 1.5; }
  #error { display: none; }
  #loading { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="loading">
    <div class="spinner"></div>
    <h1>Iniciando sesión…</h1>
    <p>Volviendo a Antológico</p>
  </div>
  <div id="error">
    <h1>Error de autenticación</h1>
    <p>No se recibió el token. Cerrá esta pestaña y probá de nuevo.</p>
  </div>
</div>
<script>
(function() {
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var idToken = params.get('id_token');
  var returnUrl = params.get('state');

  if (!idToken || !returnUrl) {
    document.getElementById('error').style.display = 'block';
    return;
  }

  document.getElementById('loading').style.display = 'block';

  // Navigate to API endpoint which does an HTTP 302 redirect to the app.
  // HTTP-level redirects to custom schemes (exp://) work in Chrome,
  // unlike JavaScript window.location.href which gets blocked.
  window.location.replace(
    '/api/auth/redirect?id_token=' + encodeURIComponent(idToken) +
    '&return_url=' + encodeURIComponent(returnUrl)
  );
})();
</script>
</body>
</html>
