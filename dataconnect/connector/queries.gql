# ─── Reservas ────────────────────────────────────────────────────────────────

query ListReservasByEspacio($espacioId: UUID!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
  @refresh(onMutationExecuted: { operation: "CancelarReserva" })
  @refresh(onMutationExecuted: { operation: "MarkReservaPaid" })
  @refresh(onMutationExecuted: { operation: "MarkReservaUnpaid" })
  @refresh(onMutationExecuted: { operation: "CancelarWorkshopConReservas", condition: "request.variables.espacioId == mutation.variables.espacioId" })
{
  reservas(
    where: {
      workshop: {
        espacioId: { eq: $espacioId }
        espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      }
    }
    orderBy: [{ fechaReserva: DESC }]
  ) {
    id estado metodoPago estadoPago fechaReserva comprobanteUrl pagoExternoId createdAt
    usuario { uid nombre email }
    workshop { id nombre fecha cuposTotales cuposDisponibles espacioId }
  }
}

# ─── Profesional ─────────────────────────────────────────────────────────────

query GetMyProfile @auth(level: USER) {
  profesionales(
    where: { uid: { eq_expr: "auth.uid" } }
    limit: 1
  ) {
    uid nombre email estado updatedAt
  }
}

# ─── Planes ───────────────────────────────────────────────────────────────────

query ListPlanes @auth(level: PUBLIC, insecureReason: "Los planes son información pública necesaria para el formulario de registro.") {
  planes(
    where: { activo: { eq: true } }
    orderBy: [{ precioMensual: ASC }]
  ) {
    id nombre precioMensual precioAnual features
  }
}

# ─── Rubros ───────────────────────────────────────────────────────────────────

query ListRubros @auth(level: PUBLIC, insecureReason: "Catálogo público de rubros necesario para el formulario de registro.") {
  rubros(
    where: { activo: { eq: true } }
    orderBy: [{ orden: ASC }, { nombre: ASC }]
  ) {
    id nombre
  }
}

# ─── Espacios ─────────────────────────────────────────────────────────────────

query ListMyEspacios @auth(level: USER) {
  espacios(
    where: { profesionalUid: { eq_expr: "auth.uid" }, estado: { eq: ACTIVO } }
    orderBy: [{ createdAt: ASC }]
  ) {
    id nombre estado cancelacionPendiente createdAt
    trialStartedAt isSuperAdmin slug bloqueado
    logoUrl logoShape logoScale logoPosition brandColors brandFont redesSociales cobros direcciones
    terminosCondiciones tycEnabled
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
    dominio_on_espacio { urlPersonalizada estado sslActivo }
  }
}

query GetMyEspacio($id: UUID!) @auth(level: USER) {
  espacios(
    where: {
      id: { eq: $id }
      profesionalUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id nombre estado cancelacionPendiente createdAt updatedAt
    trialStartedAt isSuperAdmin slug bloqueado
    logoUrl logoShape logoScale logoPosition brandColors brandFont redesSociales cobros direcciones
    terminosCondiciones tycEnabled
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
    dominio_on_espacio { urlPersonalizada estado sslActivo }
  }
}

# ─── Workshops ────────────────────────────────────────────────────────────────

query ListMyWorkshops($espacioId: UUID!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshopEstado", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "DeleteWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CancelarWorkshopConReservas", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
{
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      estado: { ne: CANCELADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue headerImagePosition metodosPago direccionId estado esBorrador createdAt
  }
}

query ListMyWorkshopsByEstado($espacioId: UUID!, $estado: EstadoWorkshop!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshopEstado", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "DeleteWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CancelarWorkshopConReservas", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
{
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      estado: { eq: $estado }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue headerImagePosition metodosPago direccionId estado esBorrador createdAt
  }
}

query SearchMyWorkshops($espacioId: UUID!, $q: String!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "DeleteWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
{
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      nombre: { contains: $q }
      estado: { ne: CANCELADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue headerImagePosition metodosPago direccionId estado esBorrador createdAt
  }
}

query GetMyWorkshop($id: UUID!) @auth(level: USER) {
  workshops(
    where: {
      id: { eq: $id }
      espacio: { profesionalUid: { eq_expr: "auth.uid" } }
    }
    limit: 1
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue headerImagePosition metodosPago direccionId estado esBorrador createdAt updatedAt
    espacio { id nombre }
  }
}

# ─── Público ──────────────────────────────────────────────────────────────────

query GetEspacioBySlug($slug: String!) @auth(level: PUBLIC, insecureReason: "Resolución de subdominio público — mapea slug a espacioId para cargar la tienda.") {
  espacios(
    where: { slug: { eq: $slug }, estado: { eq: ACTIVO } }
    limit: 1
  ) {
    id nombre slug
  }
}

query GetPublicEspacio($id: UUID!) @auth(level: PUBLIC, insecureReason: "Cualquier usuario (autenticado o no) debe poder ver la info básica de un espacio para seguirlo o reservar.") {
  espacios(
    where: { id: { eq: $id }, estado: { eq: ACTIVO } }
    limit: 1
  ) {
    id nombre estado
    logoUrl logoShape logoScale logoPosition brandColors brandFont redesSociales cobros direcciones
    rubro { id nombre }
    rubroPersonalizado
    profesional { uid nombre }
  }
}

query GetPublicEspacios($ids: [UUID!]!) @auth(level: PUBLIC, insecureReason: "Carga batch de espacios seguidos por un usuario — todos son datos públicos del marketplace.") {
  espacios(
    where: { id: { in: $ids }, estado: { eq: ACTIVO } }
  ) {
    id nombre estado
    logoUrl logoShape logoScale logoPosition brandColors brandFont redesSociales cobros direcciones
    rubro { id nombre }
    rubroPersonalizado
    profesional { uid nombre }
  }
}

query ListPublicWorkshopsByEspacio($espacioId: UUID!)
  @auth(level: PUBLIC, insecureReason: "Talleres publicados de un espacio son visibles sin login — página pública del tenant.")
  @refresh(onMutationExecuted: { operation: "CreateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkshopEstado", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "DeleteWorkshop", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CancelarWorkshopConReservas", condition: "request.variables.espacioId == mutation.variables.espacioId" })
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
{
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      estado: { eq: PUBLICADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue headerImagePosition metodosPago direccionId estado createdAt
  }
}

query ListMyReservas
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
  @refresh(onMutationExecuted: { operation: "CancelarReserva" })
  @refresh(onMutationExecuted: { operation: "CancelarWorkshopConReservas" })
{
  reservas(
    where: { usuario: { uid: { eq_expr: "auth.uid" } } }
    orderBy: [{ fechaReserva: DESC }]
  ) {
    id estado fechaReserva comprobanteUrl pagoExternoId createdAt
    workshop {
      id nombre fecha cuposTotales cuposDisponibles espacioId
      headerType headerValue headerImagePosition direccionId
      espacio {
        id nombre logoUrl logoShape logoScale logoPosition brandColors brandFont
        rubro { id nombre }
      }
    }
  }
}

query ListReservasByWorkshop($workshopId: UUID!)
  @auth(level: USER, insecureReason: "El tenant accede desde su panel; la query filtra por auth.uid a través del espacio.")
  @refresh(onMutationExecuted: { operation: "CreateReservaConUsuario" })
  @refresh(onMutationExecuted: { operation: "CancelarReserva" })
  @refresh(onMutationExecuted: { operation: "MarkReservaPaid" })
  @refresh(onMutationExecuted: { operation: "MarkReservaUnpaid" })
{
  reservas(
    where: {
      workshopId: { eq: $workshopId }
      workshop: { espacio: { profesionalUid: { eq_expr: "auth.uid" } } }
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id estado metodoPago estadoPago pagoExternoId fechaReserva
    usuario { uid nombre email }
    workshop { id nombre fecha }
  }
}

# ─── Admin (Super Admin) ─────────────────────────────────────────────────────

query AdminListAllEspacios @auth(expr: "auth.token.admin == true") {
  espacios(orderBy: [{ createdAt: DESC }]) {
    id nombre estado cancelacionPendiente createdAt updatedAt
    slug bloqueado trialStartedAt isSuperAdmin
    logoUrl logoShape logoScale logoPosition brandColors brandFont redesSociales cobros direcciones
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    profesional { uid nombre email }
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
  }
}

query AdminListAllWorkshops @auth(expr: "auth.token.admin == true") {
  workshops(orderBy: [{ createdAt: DESC }]) {
    id nombre tipo estado cuposTotales cuposDisponibles precio fecha createdAt
    espacio { id nombre profesional { uid nombre email } }
  }
}

query AdminListAllReservas @auth(expr: "auth.token.admin == true") {
  reservas(orderBy: [{ fechaReserva: DESC }]) {
    id estado fechaReserva pagoExternoId createdAt
    usuario { uid nombre email }
    workshop { id nombre fecha espacio { id nombre } }
  }
}

