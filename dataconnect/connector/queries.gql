# ─── Reservas ────────────────────────────────────────────────────────────────

query ListReservasByEspacio($espacioId: UUID!) @auth(level: USER, insecureReason: "El espacioId proviene de ListMyEspacios que ya filtra por auth.uid.") {
  reservas(
    where: {
      workshop: { espacioId: { eq: $espacioId } }
    }
    orderBy: [{ fechaReserva: DESC }]
  ) {
    id estado fechaReserva comprobanteUrl pagoExternoId createdAt
    usuario { uid nombre email }
    workshop { id nombre fecha cuposTotales cuposDisponibles espacioId }
  }
}

# ─── Profesional ─────────────────────────────────────────────────────────────

query GetMyProfile @auth(level: USER) {
  profesionales(
    where: { uid: { eq_expr: "auth.uid" } }
    limit: 1
  ) {
    uid nombre email estado updatedAt
  }
}

# ─── Planes ───────────────────────────────────────────────────────────────────

query ListPlanes @auth(level: PUBLIC, insecureReason: "Los planes son información pública necesaria para el formulario de registro.") {
  planes(
    where: { activo: { eq: true } }
    orderBy: [{ precioMensual: ASC }]
  ) {
    id nombre precioMensual precioAnual features
  }
}

# ─── Rubros ───────────────────────────────────────────────────────────────────

query ListRubros @auth(level: PUBLIC, insecureReason: "Catálogo público de rubros necesario para el formulario de registro.") {
  rubros(
    where: { activo: { eq: true } }
    orderBy: [{ orden: ASC }, { nombre: ASC }]
  ) {
    id nombre
  }
}

# ─── Espacios ─────────────────────────────────────────────────────────────────

query ListMyEspacios @auth(level: USER) {
  espacios(
    where: { profesionalUid: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: ASC }]
  ) {
    id nombre estado cancelacionPendiente createdAt
    trialStartedAt isSuperAdmin slug bloqueado
    logoUrl logoShape logoScale brandColors brandFont redesSociales cobros direcciones
    terminosCondiciones tycEnabled
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
    dominio_on_espacio { urlPersonalizada estado sslActivo }
  }
}

query GetMyEspacio($id: UUID!) @auth(level: USER) {
  espacios(
    where: {
      id: { eq: $id }
      profesionalUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id nombre estado cancelacionPendiente createdAt updatedAt
    trialStartedAt isSuperAdmin slug bloqueado
    logoUrl logoShape logoScale brandColors brandFont redesSociales cobros direcciones
    terminosCondiciones tycEnabled
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
    dominio_on_espacio { urlPersonalizada estado sslActivo }
  }
}

# ─── Workshops ────────────────────────────────────────────────────────────────

query ListMyWorkshops($espacioId: UUID!) @auth(level: USER, insecureReason: "El espacioId proviene de ListMyEspacios que ya filtra por auth.uid, garantizando que el cliente solo puede pasar IDs propios.") {
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      estado: { ne: CANCELADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue metodosPago estado createdAt
  }
}

query ListMyWorkshopsByEstado($espacioId: UUID!, $estado: EstadoWorkshop!) @auth(level: USER, insecureReason: "El espacioId proviene de ListMyEspacios que ya filtra por auth.uid, garantizando que el cliente solo puede pasar IDs propios.") {
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      estado: { eq: $estado }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue metodosPago estado createdAt
  }
}

query SearchMyWorkshops($espacioId: UUID!, $q: String!) @auth(level: USER, insecureReason: "El espacioId proviene de ListMyEspacios que ya filtra por auth.uid, garantizando que el cliente solo puede pasar IDs propios.") {
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      nombre: { contains: $q }
      estado: { ne: CANCELADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue metodosPago estado createdAt
  }
}

query GetMyWorkshop($id: UUID!) @auth(level: USER) {
  workshops(
    where: {
      id: { eq: $id }
      espacio: { profesionalUid: { eq_expr: "auth.uid" } }
    }
    limit: 1
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue metodosPago estado createdAt updatedAt
    espacio { id nombre }
  }
}

# ─── Público ──────────────────────────────────────────────────────────────────

query GetPublicEspacio($id: UUID!) @auth(level: PUBLIC, insecureReason: "Cualquier usuario (autenticado o no) debe poder ver la info básica de un espacio para seguirlo o reservar.") {
  espacios(
    where: { id: { eq: $id }, estado: { eq: ACTIVO } }
    limit: 1
  ) {
    id nombre estado
    logoUrl logoShape logoScale brandColors brandFont redesSociales
    rubro { id nombre }
    rubroPersonalizado
    profesional { uid nombre }
  }
}

query GetPublicEspacios($ids: [UUID!]!) @auth(level: PUBLIC, insecureReason: "Carga batch de espacios seguidos por un usuario — todos son datos públicos del marketplace.") {
  espacios(
    where: { id: { in: $ids }, estado: { eq: ACTIVO } }
  ) {
    id nombre estado
    logoUrl logoShape logoScale brandColors brandFont redesSociales
    rubro { id nombre }
    rubroPersonalizado
    profesional { uid nombre }
  }
}

query ListPublicWorkshopsByEspacio($espacioId: UUID!) @auth(level: PUBLIC, insecureReason: "Talleres publicados de un espacio son visibles sin login — página pública del tenant.") {
  workshops(
    where: {
      espacioId: { eq: $espacioId }
      estado: { eq: PUBLICADO }
    }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue metodosPago estado createdAt
  }
}

query ListMyReservas @auth(level: USER) {
  reservas(
    where: { usuario: { uid: { eq_expr: "auth.uid" } } }
    orderBy: [{ fechaReserva: DESC }]
  ) {
    id estado fechaReserva comprobanteUrl pagoExternoId createdAt
    workshop {
      id nombre fecha cuposTotales cuposDisponibles espacioId
      headerType headerValue
      espacio {
        id nombre logoUrl logoShape logoScale brandColors brandFont
        rubro { id nombre }
      }
    }
  }
}

# ─── Admin (Super Admin) ─────────────────────────────────────────────────────

query AdminListAllEspacios @auth(expr: "auth.token.admin == true") {
  espacios(orderBy: [{ createdAt: DESC }]) {
    id nombre estado cancelacionPendiente createdAt updatedAt
    slug bloqueado trialStartedAt isSuperAdmin
    logoUrl logoShape logoScale brandColors brandFont redesSociales cobros direcciones
    periodoFacturacion precioActual proximaRenovacion downgradePendiente cuponAplicado
    profesional { uid nombre email }
    rubro { id nombre }
    rubroPersonalizado
    plan { id nombre precioMensual precioAnual features }
  }
}

query AdminListAllWorkshops @auth(expr: "auth.token.admin == true") {
  workshops(orderBy: [{ createdAt: DESC }]) {
    id nombre tipo estado cuposTotales cuposDisponibles precio fecha createdAt
    espacio { id nombre profesional { uid nombre email } }
  }
}

query AdminListAllReservas @auth(expr: "auth.token.admin == true") {
  reservas(orderBy: [{ fechaReserva: DESC }]) {
    id estado fechaReserva pagoExternoId createdAt
    usuario { uid nombre email }
    workshop { id nombre fecha espacio { id nombre } }
  }
}

query ListPublicWorkshops @auth(level: PUBLIC, insecureReason: "Talleres publicados son el discovery público del marketplace — deben ser visibles sin login.") {
  workshops(
    where: { estado: { eq: PUBLICADO } }
    orderBy: [{ fecha: ASC }]
  ) {
    id nombre tipo descripcion
    cuposTotales cuposDisponibles precio fecha
    duracionHoras duracionMinutos experienciaPrevia scheduleData
    headerType headerValue
    espacio { id nombre profesional { uid nombre } }
  }
}
