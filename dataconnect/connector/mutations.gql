# ─── Profesional ─────────────────────────────────────────────────────────────

mutation UpsertProfesional($nombre: String!, $email: String!) @auth(level: USER) {
  profesional_upsert(data: {
    uid_expr: "auth.uid"
    nombre: $nombre
    email: $email
    updatedAt_expr: "request.time"
  })
}

# Reasigna el UID de un profesional existente cuando el usuario borró su cuenta
# Firebase Auth y se re-registró con el mismo email (obtiene un UID nuevo).
# Seguro: auth.token.email garantiza que solo el dueño del email puede reclamar la fila.
# CTE actualiza FKs dependientes (espacios) antes de cambiar el PK del profesional.
mutation ReassignProfesionalUid($nombre: String!) @auth(level: USER) {
  reassigned: _execute(
    sql: """
      WITH moved AS (
        UPDATE espacios SET profesional_uid = $1
        WHERE profesional_uid = (SELECT uid FROM profesionales WHERE email = $3)
      )
      UPDATE profesionales SET uid = $1, nombre = $2, updated_at = NOW() WHERE email = $3
    """
    params: [{_expr: "auth.uid"}, $nombre, {_expr: "auth.token.email"}]
  )
}

# ─── Espacios ─────────────────────────────────────────────────────────────────

mutation UpdateEspacioPlanId($id: UUID!, $planId: UUID!) @auth(level: USER) {
  espacio_update(
    id: $id
    data: {
      planId: $planId
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreateEspacio(
  $nombre:             String!
  $rubroId:            UUID
  $rubroPersonalizado: String
) @auth(level: USER) {
  espacio_insert(data: {
    profesionalUid_expr: "auth.uid"
    nombre:              $nombre
    rubroId:             $rubroId
    rubroPersonalizado:  $rubroPersonalizado
    createdAt_expr:      "request.time"
    updatedAt_expr:      "request.time"
  })
}

mutation UpdateEspacioIdentidad(
  $id:          UUID!
  $logoUrl:     String
  $logoShape:   String
  $logoScale:   Float
  $brandColors: Any
  $brandFont:   String
) @auth(level: USER) {
  espacio_update(
    first: {
      where: {
        id: { eq: $id }
        profesionalUid: { eq_expr: "auth.uid" }
      }
    }
    data: {
      logoUrl:        $logoUrl
      logoShape:      $logoShape
      logoScale:      $logoScale
      brandColors:    $brandColors
      brandFont:      $brandFont
      updatedAt_expr: "request.time"
    }
  )
}

