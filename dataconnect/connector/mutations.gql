mutation ActivarPlan(
  $id:                 UUID!
  $planId:             UUID!
  $periodoFacturacion: String!
  $precioActual:       Float!
  $proximaRenovacion:  Timestamp!
) @auth(level: USER) {
  espacio_update(
    first: {
      where: {
        id: { eq: $id }
        profesionalUid: { eq_expr: "auth.uid" }
      }
    }
    data: {
      planId:              $planId
      periodoFacturacion:  $periodoFacturacion
      precioActual:        $precioActual
      proximaRenovacion:   $proximaRenovacion
      downgradePendiente:  null
      cancelacionPendiente: false
      updatedAt_expr:      "request.time"
    }
  )
}

