# ─── Reservas ────────────────────────────────────────────────────────────────

# Cancela una reserva y libera el cupo atómicamente.
# El tenant pasa el workshopId para que la operación sea atómica en dos pasos.
# Ambas verificaciones (reserva y workshop) deben pertenecer a auth.uid.
mutation CancelarReserva($id: UUID!, $workshopId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    reserva(id: $id)
      @check(expr: "this != null", message: "Reserva no encontrada") {
      estado
        @check(expr: "this != 'CANCELADA'", message: "La reserva ya está cancelada")
      workshop {
        espacio {
          profesional {
            uid @check(expr: "this == auth.uid", message: "Sin permiso para cancelar esta reserva")
          }
        }
      }
    }
  }
  reserva_update(
    id: $id
    data: { estado: CANCELADA updatedAt_expr: "request.time" }
  )
  workshop_update(
    first: {
      where: {
        id: { eq: $workshopId }
        espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      }
    }
    data: { cuposDisponibles_update: { inc: 1 } updatedAt_expr: "request.time" }
  )
}

# Cancela un workshop y todas sus reservas activas atómicamente.
# Verifica ownership via CTE, luego actualiza workshop + reservas en un solo statement.
mutation CancelarWorkshopConReservas($id: UUID!, $espacioId: UUID!) @auth(level: USER) {
  canceladas: _execute(
    sql: """
      WITH auth_check AS (
        SELECT w.id
        FROM workshops w
        JOIN espacios e ON w.espacio_id = e.id
        WHERE w.id = $1 AND e.id = $2 AND e.profesional_uid = $3
      ),
      cancel_workshop AS (
        UPDATE workshops SET estado = 'CANCELADO', updated_at = NOW()
        FROM auth_check
        WHERE workshops.id = auth_check.id
      )
      UPDATE reservas SET estado = 'CANCELADA', updated_at = NOW()
      WHERE workshop_id = (SELECT id FROM auth_check) AND estado != 'CANCELADA'
    """
    params: [$id, $espacioId, {_expr: "auth.uid"}]
  )
}

# ─── Admin (Super Admin) ─────────────────────────────────────────────────────

mutation AdminUpdateEspacio(
  $id:              UUID!
  $bloqueado:       Boolean
  $trialStartedAt:  Timestamp
  $slug:            String
  $estado:          EstadoEspacio
) @auth(expr: "auth.token.admin == true") {
  espacio_update(
    id: $id
    data: {
      bloqueado:       $bloqueado
      trialStartedAt:  $trialStartedAt
      slug:            $slug
      estado:          $estado
      updatedAt_expr:  "request.time"
    }
  )
}

mutation AdminDeleteEspacio($id: UUID!) @auth(expr: "auth.token.admin == true") {
  deletedData: _execute(
    sql: """
      WITH del_reservas AS (
        DELETE FROM reservas WHERE workshop_id IN (SELECT id FROM workshops WHERE espacio_id = $1)
      ),
      del_workshops AS (
        DELETE FROM workshops WHERE espacio_id = $1
      ),
      del_dominio AS (
        DELETE FROM dominios WHERE espacio_id = $1
      )
      DELETE FROM espacios WHERE id = $1
    """
    params: [$id]
  )
}

mutation AdminDeleteProfesional($uid: String!) @auth(expr: "auth.token.admin == true") {
  profesional_delete(key: { uid: $uid })
}

mutation AdminUpsertProfesional(
  $uid:    String!
  $nombre: String!
  $email:  String!
) @auth(expr: "auth.token.admin == true") {
  profesional_upsert(data: {
    uid:           $uid
    nombre:        $nombre
    email:         $email
    updatedAt_expr: "request.time"
  })
}

# Versión robusta que maneja conflicto de email único:
# si el email ya está en uso por otro uid, usa email basado en uid.
mutation AdminEnsureProfesional(
  $uid:    String!
  $nombre: String!
  $email:  String!
) @auth(expr: "auth.token.admin == true") {
  result: _execute(
    sql: """
      INSERT INTO profesionales (uid, nombre, email, estado, created_at, updated_at)
      VALUES ($1, $2,
        CASE WHEN EXISTS (SELECT 1 FROM profesionales WHERE email = $3 AND uid != $1)
          THEN $1 || '@migrated.antologico.app'
          ELSE $3
        END,
        'ACTIVO', NOW(), NOW()
      )
      ON CONFLICT (uid) DO UPDATE SET nombre = EXCLUDED.nombre, updated_at = NOW()
    """
    params: [$uid, $nombre, $email]
  )
}

