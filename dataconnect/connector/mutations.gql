# ─── Profesional ─────────────────────────────────────────────────────────────

mutation UpsertProfesional($nombre: String!, $email: String!) @auth(level: USER) {
  profesional_upsert(data: {
    uid_expr: "auth.uid"
    nombre: $nombre
    email: $email
    updatedAt_expr: "request.time"
  })
}

