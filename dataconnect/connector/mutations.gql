# ─── Reservas (público) ─────────────────────────────────────────────────────

mutation DecrementarCupo($workshopId: UUID!) @auth(level: USER, insecureReason: "Cualquier usuario autenticado puede reservar un cupo. La transacción valida disponibilidad antes de decrementar.") @transaction {
  query @redact {
    workshop(id: $workshopId) @check(expr: "this != null", message: "Taller no encontrado") {
      cuposDisponibles @check(expr: "this > 0", message: "No hay cupos disponibles")
    }
  }
  workshop_update(
    id: $workshopId
    data: { cuposDisponibles_update: { dec: 1 } }
  )
}

# Crea una reserva atómicamente: upsert usuario, insertar reserva, decrementar cupo.
# Usado desde la página pública cuando un usuario paga (MP o Efectivo).
mutation CreateReservaConUsuario(
  $nombre:        String!
  $email:         String!
  $workshopId:    UUID!
  $estado:        EstadoReserva!
  $metodoPago:    MetodoPago
  $estadoPago:    EstadoPago
  $pagoExternoId: String
  $telefono:      String
  $cantidad:      Int
) @auth(level: USER) @transaction {
  query @redact {
    workshop(id: $workshopId) @check(expr: "this != null", message: "Taller no encontrado") {
      cuposDisponibles @check(expr: "this > 0", message: "No hay cupos disponibles")
    }
  }
  usuario_upsert(data: {
    uid_expr:       "auth.uid"
    nombre:         $nombre
    email:          $email
    updatedAt_expr: "request.time"
  })
  reserva_insert(data: {
    usuarioUid_expr: "auth.uid"
    workshopId:      $workshopId
    estado:          $estado
    metodoPago:      $metodoPago
    estadoPago:      $estadoPago
    pagoExternoId:   $pagoExternoId
    telefono:        $telefono
    cantidad:        $cantidad
    createdAt_expr:  "request.time"
    updatedAt_expr:  "request.time"
  })
  workshop_update(
    id: $workshopId
    data: { cuposDisponibles_update: { dec: 1 } }
  )
}

mutation MarkReservaPaid($id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    reserva(id: $id) @check(expr: "this != null", message: "Reserva no encontrada") {
      workshop {
        espacio {
          profesional {
            uid @check(expr: "this == auth.uid", message: "Sin permiso")
          }
        }
      }
    }
  }
  reserva_update(id: $id, data: {
    estado:         CONFIRMADA
    estadoPago:     PAGADO
    updatedAt_expr: "request.time"
  })
}

