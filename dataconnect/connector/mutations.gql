# ─── Workshops ────────────────────────────────────────────────────────────────

# @transaction verifica que el espacio pertenezca al profesional autenticado
mutation CreateWorkshop(
  $espacioId:         UUID!
  $nombre:            String!
  $tipo:              TipoWorkshop
  $descripcion:       String
  $cuposTotales:      Int!
  $cuposDisponibles:  Int!
  $precio:            Float!
  $fecha:             Timestamp!
  $duracionHoras:     Int
  $duracionMinutos:   Int
  $experienciaPrevia: Boolean
  $scheduleData:      Any
  $headerType:        HeaderType
  $headerValue:       String
  $metodosPago:       Any
  $estado:            EstadoWorkshop
) @auth(level: USER) @transaction {
  query @redact {
    espacio(id: $espacioId) @check(expr: "this != null", message: "Espacio no encontrado") {
      profesional {
        uid @check(expr: "this == auth.uid", message: "Sin permiso")
      }
    }
  }
  workshop_insert(data: {
    espacioId:         $espacioId
    nombre:            $nombre
    tipo:              $tipo
    descripcion:       $descripcion
    cuposTotales:      $cuposTotales
    cuposDisponibles:  $cuposDisponibles
    precio:            $precio
    fecha:             $fecha
    duracionHoras:     $duracionHoras
    duracionMinutos:   $duracionMinutos
    experienciaPrevia: $experienciaPrevia
    scheduleData:      $scheduleData
    headerType:        $headerType
    headerValue:       $headerValue
    metodosPago:       $metodosPago
    estado:            $estado
    createdAt_expr:    "request.time"
    updatedAt_expr:    "request.time"
  })
}

# @transaction verifica ownership del espacio antes de actualizar
mutation UpdateWorkshop(
  $id:               UUID!
  $espacioId:        UUID!
  $nombre:           String!
  $tipo:             TipoWorkshop
  $descripcion:      String
  $cuposTotales:     Int!
  $cuposDisponibles: Int!
  $precio:           Float!
  $fecha:            Timestamp!
  $duracionHoras:    Int
  $duracionMinutos:  Int
  $experienciaPrevia: Boolean
  $scheduleData:     Any
  $headerType:       HeaderType
  $headerValue:      String
  $metodosPago:      Any
  $estado:           EstadoWorkshop
) @auth(level: USER) @transaction {
  query @redact {
    espacio(id: $espacioId) @check(expr: "this != null", message: "Espacio no encontrado") {
      profesional {
        uid @check(expr: "this == auth.uid", message: "Sin permiso")
      }
    }
  }
  workshop_update(
    id: $id
    data: {
      nombre:            $nombre
      tipo:              $tipo
      descripcion:       $descripcion
      cuposTotales:      $cuposTotales
      cuposDisponibles:  $cuposDisponibles
      precio:            $precio
      fecha:             $fecha
      duracionHoras:     $duracionHoras
      duracionMinutos:   $duracionMinutos
      experienciaPrevia: $experienciaPrevia
      scheduleData:      $scheduleData
      headerType:        $headerType
      headerValue:       $headerValue
      metodosPago:       $metodosPago
      estado:            $estado
      updatedAt_expr:    "request.time"
    }
  )
}

mutation UpdateWorkshopEstado(
  $id:               UUID!
  $espacioId:        UUID!
  $estado:           EstadoWorkshop!
  $cuposDisponibles: Int!
) @auth(level: USER) {
  workshop_update(
    first: {
      where: {
        id: { eq: $id }
        espacioId: { eq: $espacioId }
        espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      }
    }
    data: {
      estado:            $estado
      cuposDisponibles:  $cuposDisponibles
      updatedAt_expr:    "request.time"
    }
  )
}

# @transaction verifica ownership antes de eliminar
mutation DeleteWorkshop($id: UUID!, $espacioId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    espacio(id: $espacioId) @check(expr: "this != null", message: "Espacio no encontrado") {
      profesional {
        uid @check(expr: "this == auth.uid", message: "Sin permiso")
      }
    }
  }
  workshop_delete(
    first: {
      where: {
        id: { eq: $id }
        espacioId: { eq: $espacioId }
      }
    }
  )
}

# ─── Suscripciones de Espacio ────────────────────────────────────────────────

mutation SolicitarCancelacionEspacio($id: UUID!) @auth(level: USER) {
  espacio_update(
    first: {
      where: {
        id: { eq: $id }
        profesionalUid: { eq_expr: "auth.uid" }
      }
    }
    data: {
      cancelacionPendiente: true
      updatedAt_expr: "request.time"
    }
  )
}

mutation ReactivarSuscripcionEspacio($id: UUID!) @auth(level: USER) {
  espacio_update(
    first: {
      where: {
        id: { eq: $id }
        profesionalUid: { eq_expr: "auth.uid" }
      }
    }
    data: {
      cancelacionPendiente: false
      updatedAt_expr: "request.time"
    }
  )
}

# ─── Reservas ────────────────────────────────────────────────────────────────

# Cancela una reserva y libera el cupo atómicamente.
# El tenant pasa el workshopId para que la operación sea atómica en dos pasos.
# Ambas verificaciones (reserva y workshop) deben pertenecer a auth.uid.
mutation CancelarReserva($id: UUID!, $workshopId: UUID!) @auth(level: USER) @transaction {
  query @redact {
    reserva(id: $id)
      @check(expr: "this != null", message: "Reserva no encontrada") {
      estado
        @check(expr: "this != 'CANCELADA'", message: "La reserva ya está cancelada")
      workshop {
        espacio {
          profesional {
            uid @check(expr: "this == auth.uid", message: "Sin permiso para cancelar esta reserva")
          }
        }
      }
    }
  }
  reserva_update(
    id: $id
    data: { estado: CANCELADA updatedAt_expr: "request.time" }
  )
  workshop_update(
    first: {
      where: {
        id: { eq: $workshopId }
        espacio: { profesionalUid: { eq_expr: "auth.uid" } }
      }
    }
    data: { cuposDisponibles_update: { inc: 1 } updatedAt_expr: "request.time" }
  )
}

mutation DecrementarCupo($workshopId: UUID!) @auth(level: USER, insecureReason: "Cualquier usuario autenticado puede reservar un cupo. La transacción valida disponibilidad antes de decrementar.") @transaction {
  query @redact {
    workshop(id: $workshopId) @check(expr: "this != null", message: "Taller no encontrado") {
      cuposDisponibles @check(expr: "this > 0", message: "No hay cupos disponibles")
    }
  }
  workshop_update(
    id: $workshopId
    data: { cuposDisponibles_update: { dec: 1 } }
  )
}

# Crea una reserva atómicamente: upsert usuario, insertar reserva, decrementar cupo.
# Usado desde la página pública cuando un usuario paga (MP o Efectivo).
mutation CreateReservaConUsuario(
  $nombre:        String!
  $email:         String!
  $workshopId:    UUID!
  $estado:        EstadoReserva!
  $pagoExternoId: String
) @auth(level: USER) @transaction {
  query @redact {
    workshop(id: $workshopId) @check(expr: "this != null", message: "Taller no encontrado") {
      cuposDisponibles @check(expr: "this > 0", message: "No hay cupos disponibles")
    }
  }
  usuario_upsert(data: {
    uid_expr:       "auth.uid"
    nombre:         $nombre
    email:          $email
    updatedAt_expr: "request.time"
  })
  reserva_insert(data: {
    usuarioUid_expr: "auth.uid"
    workshopId:      $workshopId
    estado:          $estado
    pagoExternoId:   $pagoExternoId
    createdAt_expr:  "request.time"
    updatedAt_expr:  "request.time"
  })
  workshop_update(
    id: $workshopId
    data: { cuposDisponibles_update: { dec: 1 } }
  )
}
