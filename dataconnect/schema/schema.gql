# Antológico — Firebase SQL Connect Schema

# ─── Enums ───────────────────────────────────────────────────────────────────

enum EstadoProfesional { ACTIVO SUSPENDIDO INACTIVO }
enum EstadoEspacio     { ACTIVO SUSPENDIDO INACTIVO }
enum EstadoDominio     { PENDIENTE ACTIVO ERROR }
enum EstadoWorkshop    { BORRADOR PUBLICADO CANCELADO FINALIZADO }
enum TipoWorkshop      { WORKSHOP TALLER CLASE CURSO }
enum HeaderType        { COLOR IMAGE }
enum EstadoUsuario     { ACTIVO SUSPENDIDO }
enum EstadoReserva     { PENDIENTE CONFIRMADA CANCELADA }
enum MetodoPago        { EFECTIVO MERCADO_PAGO }
enum EstadoPago        { PENDIENTE PAGADO }

# ─── Rubros (catálogo de categorías de negocio) ───────────────────────────────
# Gestionado por Super Admin. Los tenants eligen uno al crear su Espacio.
# Si eligen "Otro", el texto queda en Espacio.rubroPersonalizado para revisión.

type Rubro @table(name: "rubros", singular: "rubro", plural: "rubros") {
  nombre:    String!    @col(dataType: "varchar(100)")
  activo:    Boolean!   @default(value: true)
  orden:     Int!       @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

# ─── Planes de suscripción (gestionados por Super Admin) ─────────────────────

type Plan @table(name: "planes", singular: "plan", plural: "planes") {
  nombre:        String!    @col(dataType: "varchar(100)")
  precioMensual: Float!
  precioAnual:   Float!
  features:      Any!
  activo:        Boolean!   @default(value: true)
  createdAt:     Timestamp! @default(expr: "request.time")
}

# ─── Profesionales (Tenants) ──────────────────────────────────────────────────
# Keyed by Firebase Auth UID. Solo guarda datos de la cuenta; el negocio vive en Espacio.

type Profesional @table(name: "profesionales", key: "uid", singular: "profesional", plural: "profesionales") {
  uid:       String!    @default(expr: "auth.uid")
  nombre:    String!    @col(dataType: "varchar(200)")
  email:     String!    @unique @col(dataType: "varchar(255)")
  estado:    EstadoProfesional! @default(value: ACTIVO)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# ─── Espacios (negocios/tiendas del profesional) ──────────────────────────────
# Un profesional puede tener múltiples espacios. Cada espacio tiene su propio
# plan, dominio, marca y talleres.

type Espacio @table(name: "espacios", singular: "espacio", plural: "espacios")
  @index(fields: ["profesionalUid"]) {
  profesional:        Profesional!
  nombre:             String!    @col(dataType: "varchar(200)")
  rubro:              Rubro                              # null si eligió "Otro"
  rubroPersonalizado: String     @col(dataType: "varchar(200)")  # texto libre cuando rubro == null
  plan:                   Plan
  metodoPagoToken:        String     @col(dataType: "varchar(255)")
  template:               String     @col(dataType: "varchar(100)")
  logoUrl:                String     # TEXT — permite base64 de logo comprimido
  logoShape:              String     @col(dataType: "varchar(20)")   # 'round' | 'rounded' | 'square'
  logoScale:              Float                                       # zoom del logo 0.4–2.0
  logoPosition:           Any                                        # JSON: { x: number, y: number } para encuadre
  brandColors:            Any        # JSON: array de hex strings, ej. ["#E85D4A","#3B82F6"]
  brandFont:              String     @col(dataType: "varchar(100)")  # Google Font name
  redesSociales:          Any        # JSON: { style, minimalColor, links: { instagram, … } }
  cobros:                 Any        # JSON: { efectivo, mercadoPago, linksDePago, links: [{id,nombre,url}] }
  direcciones:            Any        # JSON: [{id, nombre, barrio, calle, altura, piso, apto}]
  slug:                   String     @col(dataType: "varchar(100)")
  terminosCondiciones:    String     # HTML generado por el rich-editor del tenant
  tycEnabled:             Boolean!   @default(value: false)
  bloqueado:              Boolean!   @default(value: false)
  trialStartedAt:         Timestamp
  isSuperAdmin:           Boolean!   @default(value: false)
  estado:                 EstadoEspacio! @default(value: ACTIVO)
  cancelacionPendiente:   Boolean!   @default(value: false)
  periodoFacturacion:     String     @col(dataType: "varchar(20)")
  precioActual:           Float
  proximaRenovacion:      Timestamp
  downgradePendiente:     Any
  cuponAplicado:          Any
  createdAt:          Timestamp! @default(expr: "request.time")
  updatedAt:          Timestamp! @default(expr: "request.time")
}

# ─── Dominios personalizados ──────────────────────────────────────────────────
# Relación 1:1 con Espacio (no con Profesional — cada negocio tiene su dominio).

type Dominio @table(name: "dominios", singular: "dominio", plural: "dominios") {
  espacio:          Espacio!  @unique
  urlPersonalizada: String!   @unique @col(dataType: "varchar(255)")
  estado:           EstadoDominio! @default(value: PENDIENTE)
  sslActivo:        Boolean!  @default(value: false)
  nameservers:      Any
  createdAt:        Timestamp! @default(expr: "request.time")
  updatedAt:        Timestamp! @default(expr: "request.time")
}

# ─── Talleres ─────────────────────────────────────────────────────────────────

type Workshop @table(name: "workshops")
  @index(fields: ["espacioId", "estado"])
  @index(fields: ["fecha"]) {
  espacio:          Espacio!
  nombre:           String!        @col(dataType: "varchar(200)")
  tipo:             TipoWorkshop
  descripcion:      String
  cuposTotales:     Int!
  cuposDisponibles: Int!
  precio:           Float!
  fecha:            Timestamp!
  duracionHoras:     Int
  duracionMinutos:   Int
  experienciaPrevia: Boolean
  scheduleData:      Any
  headerType:        HeaderType!    @default(value: COLOR)
  headerValue:       String         @col(dataType: "text")
  metodosPago:       Any            # JSON: array de IDs, ej. ["efectivo","mercadopago","link-uuid"]
  direccionId:       String         @col(dataType: "varchar(100)")  # UUID de la dirección del espacio
  headerImagePosition: Any          # JSON: { x: number, y: number }
  estado:            EstadoWorkshop! @default(value: BORRADOR)
  esBorrador:        Boolean! @default(value: false)
  createdAt:        Timestamp! @default(expr: "request.time")
  updatedAt:        Timestamp! @default(expr: "request.time")
}

# ─── Usuarios finales (Mobile) ────────────────────────────────────────────────

type Usuario @table(name: "usuarios", key: "uid", singular: "usuario", plural: "usuarios") {
  uid:                String!   @default(expr: "auth.uid")
  nombre:             String!   @col(dataType: "varchar(200)")
  email:              String!   @unique @col(dataType: "varchar(255)")
  estado:             EstadoUsuario! @default(value: ACTIVO)
  notifReservas:      Boolean!  @default(value: true)
  notifRecordatorios: Boolean!  @default(value: true)
  createdAt:          Timestamp! @default(expr: "request.time")
  updatedAt:          Timestamp! @default(expr: "request.time")
}

# ─── Reservas ─────────────────────────────────────────────────────────────────

type Reserva @table(name: "reservas", singular: "reserva", plural: "reservas") {
  usuario:        Usuario!
  workshop:       Workshop!
  fechaReserva:   Timestamp! @default(expr: "request.time")
  estado:         EstadoReserva! @default(value: PENDIENTE)
  metodoPago:     MetodoPago
  estadoPago:     EstadoPago     @default(value: PENDIENTE)
  telefono:       String     @col(dataType: "varchar(50)")
  cantidad:       Int        @default(value: 1)
  comprobanteUrl: String     @col(dataType: "varchar(500)")
  pagoExternoId:  String     @col(dataType: "varchar(255)")
  createdAt:      Timestamp! @default(expr: "request.time")
  updatedAt:      Timestamp! @default(expr: "request.time")
}

# ─── Super Admins ─────────────────────────────────────────────────────────────

type SuperAdmin @table(name: "super_admins", key: "uid", singular: "superAdmin", plural: "superAdmins") {
  uid:       String!    @default(expr: "auth.uid")
  nombre:    String!    @col(dataType: "varchar(200)")
  email:     String!    @unique @col(dataType: "varchar(255)")
  createdAt: Timestamp! @default(expr: "request.time")
}
